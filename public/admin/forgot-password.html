<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Volkron - Recuperar clave</title>
    <link rel="stylesheet" href="/admin/assets/admin.css">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card">
        <span class="eyebrow">Volkron Servicios</span>
        <h1>Recuperar clave</h1>
        <p>Ingresa el email asociado a tu usuario. Si existe una cuenta activa, enviaremos un enlace de recuperacion.</p>
        <form method="post" action="/admin/forgot-password" class="login-form">
          <label>
            <span>Email</span>
            <input name="email" type="email" autocomplete="email" required>
          </label>
          <div class="login-success" data-sent>Si el correo existe, enviaremos un enlace de recuperacion.</div>
          <div class="login-error" data-invalid>El enlace no es valido o ya expiro.</div>
          <button class="primary-button" type="submit">Enviar enlace</button>
          <a class="login-link" href="/admin/login">Volver al acceso</a>
        </form>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      if (params.get('sent')) document.querySelector('[data-sent]').classList.add('is-visible');
      if (params.get('invalid')) document.querySelector('[data-invalid]').classList.add('is-visible');
    </script>
  </body>
</html>
