<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Volkron - Estadisticas</title>
    <link rel="stylesheet" href="/admin/assets/admin.css">
  </head>
  <body>
    <div class="admin-layout">
      <div class="sidebar-backdrop" data-sidebar-close></div>
      <aside class="sidebar" data-sidebar>
        <div class="sidebar__brand">
          <span class="eyebrow">Volkron Servicios</span>
          <strong>Panel operativo</strong>
        </div>
        <nav class="sidebar__nav" aria-label="Navegacion admin">
          <a href="/admin">Cotizaciones</a>
          <a href="/admin/new">Nueva solicitud</a>
          <a class="is-active" href="/admin/stats">Estadisticas</a>
          <a href="/admin/schedule">Agenda</a>
          <a href="/admin/settings">Opciones</a>
        </nav>
        <form class="sidebar__logout" method="post" action="/admin/logout">
          <button class="ghost-button" type="submit">Salir</button>
        </form>
      </aside>

      <div class="admin-main">
        <header class="topbar">
          <button class="menu-button" type="button" data-sidebar-toggle aria-label="Abrir menu">Menu</button>
          <div>
            <span class="eyebrow">Volkron Servicios</span>
            <h1>Estadisticas</h1>
          </div>
          <div class="topbar__actions">
            <button class="ghost-button" type="button" data-refresh-stats>Actualizar</button>
          </div>
        </header>

        <main class="shell">
          <section class="stats-grid" data-kpis>
            <div class="empty">Cargando estadisticas...</div>
          </section>

          <section class="stats-layout">
            <article class="stats-panel">
              <h2>Solicitudes por estado</h2>
              <div data-chart="status"></div>
            </article>
            <article class="stats-panel">
              <h2>Servicios mas solicitados</h2>
              <div data-chart="service"></div>
            </article>
            <article class="stats-panel">
              <h2>Regiones</h2>
              <div data-chart="region"></div>
            </article>
            <article class="stats-panel">
              <h2>Ultimos 14 dias</h2>
              <div data-chart="daily"></div>
            </article>
            <article class="stats-panel stats-panel--wide">
              <h2>Ultimos 6 meses</h2>
              <div data-chart="monthly"></div>
            </article>
          </section>
        </main>
      </div>
    </div>

    <script src="/admin/assets/layout.js" defer></script>
    <script src="/admin/assets/stats.js" defer></script>
  </body>
</html>
