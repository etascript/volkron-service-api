<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Volkron - Acceso</title>
    <link rel="stylesheet" href="/admin/assets/admin.css">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card">
        <span class="eyebrow">Volkron Servicios</span>
        <h1>Acceso admin</h1>
        <p>Ingresa con tus credenciales para revisar cotizaciones y estadisticas.</p>
        <form method="post" action="/admin/login" class="login-form">
          <label>
            <span>Usuario</span>
            <input name="user" autocomplete="username" required>
          </label>
          <label>
            <span>Clave</span>
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <div class="login-error" data-login-error>Credenciales invalidas.</div>
          <div class="login-success" data-reset-success>Clave actualizada. Ya puedes ingresar.</div>
          <button class="primary-button" type="submit">Ingresar</button>
          <a class="login-link" href="/admin/forgot-password">Olvide mi clave</a>
        </form>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      if (params.get('error')) {
        document.querySelector('[data-login-error]').classList.add('is-visible');
      }
      if (params.get('reset')) {
        document.querySelector('[data-reset-success]').classList.add('is-visible');
      }
    </script>
  </body>
</html>
