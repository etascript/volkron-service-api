<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Volkron - Nueva clave</title>
    <link rel="stylesheet" href="/admin/assets/admin.css">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card">
        <span class="eyebrow">Volkron Servicios</span>
        <h1>Nueva clave</h1>
        <p>Define una nueva clave para tu usuario. Debe tener al menos 10 caracteres.</p>
        <form method="post" action="/admin/reset-password" class="login-form">
          <input type="hidden" name="token" data-token>
          <label>
            <span>Nueva clave</span>
            <input name="password" type="password" autocomplete="new-password" minlength="10" required>
          </label>
          <label>
            <span>Repetir clave</span>
            <input name="password_confirm" type="password" autocomplete="new-password" minlength="10" required>
          </label>
          <div class="login-error" data-match>Las claves no coinciden.</div>
          <button class="primary-button" type="submit">Actualizar clave</button>
        </form>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      document.querySelector('[data-token]').value = params.get('token') || '';
      if (params.get('error') === 'match') document.querySelector('[data-match]').classList.add('is-visible');
    </script>
  </body>
</html>
