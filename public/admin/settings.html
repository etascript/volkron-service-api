<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Volkron - Opciones</title>
    <link rel="stylesheet" href="/admin/assets/admin.css">
  </head>
  <body>
    <div class="admin-layout">
      <div class="sidebar-backdrop" data-sidebar-close></div>
      <aside class="sidebar" data-sidebar>
        <div class="sidebar__brand">
          <span class="eyebrow">Volkron Servicios</span>
          <strong>Panel operativo</strong>
        </div>
        <nav class="sidebar__nav" aria-label="Navegacion admin">
          <a href="/admin">Cotizaciones</a>
          <a href="/admin/new">Nueva solicitud</a>
          <a href="/admin/stats">Estadisticas</a>
          <a class="is-active" href="/admin/settings">Opciones</a>
        </nav>
        <form class="sidebar__logout" method="post" action="/admin/logout">
          <button class="ghost-button" type="submit">Salir</button>
        </form>
      </aside>

      <div class="admin-main">
        <header class="topbar">
          <button class="menu-button" type="button" data-sidebar-toggle aria-label="Abrir menu">Menu</button>
          <div>
            <span class="eyebrow">Volkron Servicios</span>
            <h1>Opciones</h1>
          </div>
        </header>

        <main class="shell">
          <section class="settings-panel">
            <div class="settings-panel__head">
              <div>
                <span class="eyebrow">Formulario cotizacion</span>
                <h2>Estados del registro</h2>
              </div>
              <button class="ghost-button settings-add" type="button" data-add-status>Agregar estado</button>
            </div>

            <form data-settings-form>
              <div class="settings-statuses" data-statuses></div>
              <button class="primary-button" type="submit">Guardar opciones</button>
            </form>
          </section>
        </main>
      </div>
    </div>

    <script src="/admin/assets/layout.js" defer></script>
    <script src="/admin/assets/settings.js" defer></script>
  </body>
</html>
